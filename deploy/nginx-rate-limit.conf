# Install in the nginx http context, e.g. /etc/nginx/conf.d/modelops-rate-limit.conf.
# If behind a CDN, first configure its trusted proxy ranges in your existing site.
limit_req_zone $binary_remote_addr zone=modelops_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=modelops_infer:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=modelops_connections:10m;
