# Include in your existing HTTPS server block. No DNS or certificate change needed.
location = /modelops { return 308 /modelops/; }

location ^~ /modelops/ {
    # Keep /modelops/ in the upstream URI so mounted static assets resolve.
    proxy_pass http://172.30.80.2:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;
    client_max_body_size 40k;
    limit_req zone=modelops_api burst=40 nodelay;
    limit_req_status 429;
    limit_conn modelops_connections 20;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}

location = /modelops/api/infer {
    proxy_pass http://172.30.80.2:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 10s;
    proxy_cache off;
    client_max_body_size 40k;
    limit_req zone=modelops_infer burst=6 nodelay;
    limit_req_status 429;
    limit_conn modelops_connections 8;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
